# Representative research questions for the evaluation harness (ARCHITECTURE.md §11).
# Each case is run through the graph; `followups` (if present) are sent afterward in the
# same session via the checkpointer, exactly like the API's /ask endpoint.

- id: single_aapl_direct
  question: "Analyze AAPL"
  expected_query_type: single
  expected_tickers: [AAPL]
  followups: []

- id: single_nvda_natural_language
  question: "What is the financial health of NVIDIA?"
  expected_query_type: single
  expected_tickers: [NVDA]
  followups: []

- id: single_thin_coverage_company
  # A real but far less-followed ticker than the mega-caps above — exercises the "few or
  # no news results" path (web_search.py's text-search fallback / empty-results handling)
  # under realistic conditions rather than a contrived one.
  question: "Analyze UNFI"
  expected_query_type: single
  expected_tickers: [UNFI]
  followups: []

- id: comparison_two_stocks
  question: "Compare NVIDIA and AMD"
  expected_query_type: comparison
  expected_tickers: [NVDA, AMD]
  followups:
    - question: "Which of the two has the higher profit margin?"
      expected_path: answer
    - question: "Now also add Intel to this comparison"
      expected_path: add_ticker
      expected_tickers: [NVDA, AMD, INTC]

- id: comparison_three_stocks
  question: "Compare Apple, Microsoft, and Google"
  expected_query_type: comparison
  expected_tickers: [AAPL, MSFT, GOOGL]
  followups: []

- id: portfolio_three_stocks
  question: "Analyze my portfolio of NVIDIA, Apple and Microsoft"
  expected_query_type: portfolio
  expected_tickers: [NVDA, AAPL, MSFT]
  followups: []

- id: invalid_ticker_only
  question: "Analyze ZZZINVALIDTICKERXYZ"
  # No valid ticker survives resolution -> resolve_tickers downgrades query_type to
  # "single" even though nothing was actually researched (see router_node.py).
  expected_query_type: single
  expected_tickers: []
  followups: []

- id: comparison_with_one_invalid_ticker
  question: "Compare Apple and ZZZINVALIDTICKERXYZ"
  # Only one ticker survives resolution -> downgraded from "comparison" to "single"
  # (test_router_drops_invalid_ticker_and_downgrades_query_type covers this at the
  # pytest level with a mocked decision; this asserts the same behavior end-to-end).
  expected_query_type: single
  expected_tickers: [AAPL]
  followups: []

- id: max_tickers_cap
  question: "Compare Apple, Microsoft, Google, Amazon, NVIDIA, and Tesla"
  # Not asserting expected_tickers here: which 5 of the 6 survive the MAX_TICKERS cap
  # depends on the LLM's own extraction order, not something to hardcode as "correct".
  expected_query_type: comparison
  followups: []

- id: followup_refresh_path
  question: "Analyze AAPL"
  expected_query_type: single
  expected_tickers: [AAPL]
  followups:
    - question: "Any fresh news on Apple today?"
      expected_path: refresh

- id: followup_answer_path
  question: "Analyze AAPL"
  expected_query_type: single
  expected_tickers: [AAPL]
  followups:
    - question: "What is the trailing P/E ratio?"
      expected_path: answer

- id: portfolio_natural_language
  question: "I hold Microsoft, NVIDIA, and Amazon stock — how is my portfolio doing?"
  expected_query_type: portfolio
  expected_tickers: [MSFT, NVDA, AMZN]
  followups: []

# --- discovery detection: this app analyzes stocks it's given, it does not screen a
# market/sector for candidates. These cases guard against the two failure modes that
# matter most: fabricating a shortlist, and turning an unsupported request into an
# unnecessary clarification loop (asking for market cap/dividend/risk tolerance etc.).
# `expected_discovery: true` is checked mechanically (objective_checks.py) — it only
# asserts no ticker was fabricated, not that the model literally set an internal flag,
# since either a discovery-limitation reply or one clarifying question are both safe
# outcomes; fabricating a candidate is the only real failure.

- id: discovery_sector_scope
  question: "Which Indian healthcare stocks have been hit hardest by recent negative news?"
  expected_discovery: true
  followups: []

- id: discovery_best_of_criterion
  question: "Find me the best IT stocks."
  expected_discovery: true
  followups: []

- id: discovery_undervalued_criterion
  question: "Find stocks that are undervalued."
  expected_discovery: true
  followups: []

- id: discovery_revealed_via_clarification_reply
  # Reproduces the reported bug conversation directly: a scope-free vague question
  # correctly asks which stocks, then the reply reveals the user actually wants the
  # market screened — that reply must not spiral into more preference questions.
  question: "Which stock is more affected by recent negative news?"
  followups:
    - question: "I'm asking about any Indian stock I can purchase."
      expected_discovery: true

- id: not_discovery_when_specific_stocks_given
  # Negative case: specific companies ARE named, so this must proceed as a normal
  # comparison — the discovery check must not misfire just because the question is
  # framed as "which one is best". expected_tickers uses bare symbols (no exchange
  # suffix) since check_tickers_correct compares on the bare form either way.
  question: "I'm considering Sun Pharma, Cipla and Dr Reddy's. Which one has been affected most by recent negative news?"
  expected_query_type: comparison
  expected_tickers: [SUNPHARMA, CIPLA, DRREDDY]
  followups: []

- id: discovery_followup_similar_stocks
  # Discovery intent surfacing mid-session, not on the first message — must not be
  # forced into add_ticker (inventing a company) or answer (improvising a suggestion).
  question: "Analyze AAPL"
  followups:
    - question: "What other good tech stocks should I look at?"
      expected_discovery: true
