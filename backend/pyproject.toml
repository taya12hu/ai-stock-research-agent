[project]
name = "ai-stock-research-agent-backend"
version = "0.1.0"
description = "Backend for the AI Stock Research Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "yfinance>=0.2.48",
    "requests>=2.32",
    "ddgs>=9.0",
    "pandas>=2.2",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "langgraph>=0.2.60",
    "langchain-groq>=0.2.1",
    "langchain-core>=0.3.28",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
